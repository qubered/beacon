name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26.2", cache: true }
      - run: gofmt -l ./cmd ./internal ./pkg ./test | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
        env:
          BEACON_TEST_DATABASE_URL: postgres://beacon:beacon@localhost:5432/beacon_test?sslmode=disable
      # Against its own database, because the test job above has already
      # migrated beacon_test — and through beaconctl rather than a psql loop,
      # so this exercises the migration runner operators actually use (the
      # ledger, the per-migration transaction, the ordering) instead of only
      # proving the SQL parses.
      - name: Migrations apply cleanly from scratch
        run: |
          PGPASSWORD=beacon createdb -h localhost -U beacon beacon_migrate
          go run ./cmd/beaconctl migrate \
            --database-url "postgres://beacon:beacon@localhost:5432/beacon_migrate?sslmode=disable"
      - name: Migrations are idempotent
        run: |
          go run ./cmd/beaconctl migrate \
            --database-url "postgres://beacon:beacon@localhost:5432/beacon_migrate?sslmode=disable" \
            | grep -q 'up to date'

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Design principle 1: no vendor names in the codebase. A failure here is a
      # design review finding, not a lint nit.
      - run: ./tools/lint/vendorcheck.sh

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
